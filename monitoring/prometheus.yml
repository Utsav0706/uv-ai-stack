# Prometheus for the whole system (docker-compose.yml): Pitwall and Gearbox by service
# name. The alert rules are Pitwall's (mounted from its repository).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: pitwall
    metrics_path: /metrics/
    static_configs:
      - targets: ["pitwall:8003"]
  - job_name: gearbox
    metrics_path: /metrics/
    static_configs:
      - targets: ["gearbox-api:8002"]
